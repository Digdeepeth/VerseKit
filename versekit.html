<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerseKit • Community Assets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .asset-card { transition: all 0.2s; }
    .asset-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
  </style>
  <script defer data-domain="your-domain.com" src="https://analytics.vgdh.io/js/script.js"></script>

</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">
  <div class="max-w-7xl mx-auto px-6 py-8">
    <!-- Header -->
    <div class="flex justify-between items-center mb-10">
      <div>
        <h1 class="text-4xl font-bold text-white">VerseKit</h1>
        <p class="text-emerald-400 text-sm">Community Asset Hub • Powered by Verse</p>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="alert('Upload feature coming in v0.2 🔥')" 
                class="bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-xl font-medium flex items-center gap-2">
          <i class="fas fa-upload"></i> Upload Asset
        </button>
      </div>
    </div>

    <!-- Search & Filters -->
    <div class="flex flex-col md:flex-row gap-4 mb-8">
      <div class="flex-1">
        <div class="relative">
          <input id="searchInput" 
                 type="text" 
                 placeholder="Search assets... (logo, banner, template...)"
                 class="w-full bg-gray-900 border border-gray-700 rounded-2xl py-4 px-6 pl-12 focus:outline-none focus:border-emerald-500">
          <i class="fas fa-search absolute left-5 top-4.5 text-gray-500"></i>
        </div>
      </div>
      
      <select id="categoryFilter" class="bg-gray-900 border border-gray-700 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500">
        <option value="">All Categories</option>
        <option value="logo">Logos</option>
        <option value="banner">Banners & Headers</option>
        <option value="template">Templates</option>
        <option value="guideline">Brand Guidelines</option>
        <option value="social">Social Media Kits</option>
        <option value="video">Video Assets</option>
      </select>
    </div>

    <!-- Gallery -->
    <div id="assetGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Populated by JS -->
    </div>
  </div>

  <script>
    const assets = [
      { id: 1, title: "Verse Primary Logo", category: "logo", type: "PNG + SVG", size: "2.4 MB", img: "https://picsum.photos/id/237/400/300" },
      { id: 2, title: "Verse Dark Logo Pack", category: "logo", type: "PNG + SVG", size: "4.1 MB", img: "https://picsum.photos/id/201/400/300" },
      { id: 3, title: "Twitter Header Template", category: "banner", type: "PSD + PNG", size: "12 MB", img: "https://picsum.photos/id/180/400/300" },
      { id: 4, title: "Community Banner Set", category: "banner", type: "PNG", size: "8.7 MB", img: "https://picsum.photos/id/251/400/300" },
      { id: 5, title: "Content Creation Template", category: "template", type: "Canva + Figma", size: "45 MB", img: "https://picsum.photos/id/201/400/300" },
      { id: 6, title: "Brand Guidelines v1.2", category: "guideline", type: "PDF", size: "6.8 MB", img: "https://picsum.photos/id/133/400/300" },
      { id: 7, title: "Social Media Kit 2026", category: "social", type: "ZIP", size: "28 MB", img: "https://picsum.photos/id/180/400/300" },
    ];

    function renderAssets(filteredAssets) {
      const grid = document.getElementById('assetGrid');
      grid.innerHTML = '';

      filteredAssets.forEach(asset => {
        const card = document.createElement('div');
        card.className = 'asset-card bg-gray-900 border border-gray-800 rounded-3xl overflow-hidden';
        card.innerHTML = `
          <img src="${asset.img}" class="w-full h-48 object-cover">
          <div class="p-5">
            <div class="flex justify-between items-start mb-3">
              <h3 class="font-semibold text-white">${asset.title}</h3>
              <span class="text-xs px-3 py-1 bg-gray-800 rounded-full text-emerald-400">${asset.category}</span>
            </div>
            <div class="text-sm text-gray-400 mb-4">${asset.type} • ${asset.size}</div>
            <button onclick="downloadAsset('${asset.title}')" 
                    class="w-full bg-gray-800 hover:bg-emerald-600 transition-colors py-3 rounded-2xl text-sm font-medium">
              Download
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function downloadAsset(name) {
      alert(`Downloading: ${name}\n\n(In real version this would trigger actual download)`);
    }

    // Search & Filter
    function filterAssets() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;

      const filtered = assets.filter(asset => {
        const matchesSearch = asset.title.toLowerCase().includes(searchTerm);
        const matchesCategory = !category || asset.category === category;
        return matchesSearch && matchesCategory;
      });

      renderAssets(filtered);
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', filterAssets);
    document.getElementById('categoryFilter').addEventListener('change', filterAssets);

    // Initial render
    renderAssets(assets);
  </script>
</body>
</html>
