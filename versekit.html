<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerseKit • Community Assets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .asset-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .asset-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col">
  <div class="max-w-7xl mx-auto px-6 py-10 flex-1">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
      <div>
        <h1 class="text-5xl font-bold tracking-tight text-white">VerseKit</h1>
        <p class="text-emerald-400 mt-1 text-lg">Official Verse Community Asset Hub</p>
      </div>
      
      <button onclick="showUploadModal()" 
              class="bg-emerald-600 hover:bg-emerald-500 px-8 py-4 rounded-2xl font-semibold flex items-center gap-3 transition-all">
        <i class="fas fa-upload"></i>
        <span>Upload New Asset</span>
      </button>
    </div>

    <!-- Search & Filters -->
    <div class="flex flex-col md:flex-row gap-4 mb-10">
      <div class="flex-1 relative">
        <input id="searchInput" type="text" placeholder="Search assets..." 
               class="w-full bg-gray-900 border border-gray-700 focus:border-emerald-500 rounded-3xl py-5 px-6 pl-14 text-lg focus:outline-none">
        <i class="fas fa-search absolute left-6 top-5 text-gray-500 text-xl"></i>
      </div>
      <select id="categoryFilter" class="bg-gray-900 border border-gray-700 rounded-3xl px-8 py-5 focus:outline-none focus:border-emerald-500">
        <option value="">All Categories</option>
        <option value="logo">Logos</option>
        <option value="banner">Banners</option>
        <option value="template">Templates</option>
        <option value="guideline">Guidelines</option>
        <option value="social">Social Kits</option>
      </select>
    </div>

    <div id="assetGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </div>

  <!-- Footer with Social Icons in same container -->
  <footer class="bg-gray-900 border-t border-gray-800 py-8">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <!-- Branding -->
        <div>
          <p class="text-white font-medium text-lg">VerseKit</p>
          <p class="text-gray-500 text-sm">Built for the Verse Community</p>
        </div>

        <!-- Social Icons -->
        <div class="flex gap-8 text-2xl text-gray-400">
          <a href="#" class="hover:text-emerald-400 transition-colors"><i class="fab fa-x-twitter"></i></a>
          <a href="#" class="hover:text-emerald-400 transition-colors"><i class="fab fa-telegram"></i></a>
          <a href="#" class="hover:text-emerald-400 transition-colors"><i class="fab fa-discord"></i></a>
          <a href="#" class="hover:text-emerald-400 transition-colors"><i class="fab fa-github"></i></a>
        </div>

        <!-- Copyright -->
        <div class="text-gray-500 text-sm text-center md:text-right">
          © 2026 Verse Ecosystem • Nigeria
        </div>
      </div>
    </div>
  </footer>

  <!-- Upload Modal -->
  <div id="uploadModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
    <div
