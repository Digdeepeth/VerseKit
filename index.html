<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerseKit • Community Assets</title>
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:;">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col">
  <div class="max-w-7xl mx-auto px-6 py-10 flex-1">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
      <div>
        <h1 class="text-5xl font-bold tracking-tight text-white">VerseKit</h1>
        <p class="text-emerald-400 mt-1 text-lg">Verse Community Asset Hub</p>
      </div>
      <button onclick="showUploadModal()" class="bg-emerald-600 hover:bg-emerald-500 px-8 py-4 rounded-2xl font-semibold flex items-center gap-3">
        <i class="fas fa-upload"></i>
        <span>Upload New Asset</span>
      </button>
    </div>

    <div class="flex flex-col md:flex-row gap-4 mb-10">
      <div class="flex-1 relative">
        <input id="searchInput" type="text" placeholder="Search assets..." 
               class="w-full bg-gray-900 border border-gray-700 focus:border-emerald-500 rounded-3xl py-5 px-6 pl-14 text-lg focus:outline-none">
        <i class="fas fa-search absolute left-6 top-5 text-gray-500 text-xl"></i>
      </div>
      <select id="categoryFilter" class="bg-gray-900 border border-gray-700 rounded-3xl px-8 py-5 focus:outline-none focus:border-emerald-500">
        <option value="">All Categories</option>
        <option value="logo">Logos</option>
        <option value="banner">Banners</option>
        <option value="template">Templates</option>
        <option value="guideline">Guidelines</option>
        <option value="social">Social Kits</option>
      </select>
    </div>

    <div id="assetGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-md p-8">
      <h2 class="text-2xl font-bold mb-6">Upload New Asset</h2>
      
      <div class="space-y-6">
        <div>
          <label class="block text-sm text-gray-400 mb-2">Asset Name</label>
          <input id="assetName" type="text" class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-5 py-4" placeholder="Enter asset name">
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">Category</label>
          <select id="uploadCategory" class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-5 py-4">
            <option value="logo">Logo</option>
            <option value="banner">Banner</option>
            <option value="template">Template</option>
            <option value="guideline">Guideline</option>
            <option value="social">Social Kit</option>
          </select>
        </div>

        <input type="file" id="fileInput" class="hidden" accept="image/*,.pdf,.zip">
        <div id="dropZone" class="border-2 border-dashed border-gray-600 hover:border-emerald-500 rounded-3xl p-12 text-center cursor-pointer">
          <i class="fas fa-cloud-upload-alt text-5xl text-gray-400 mb-4"></i>
          <p class="text-gray-300">Drop file here or click to browse</p>
        </div>
      </div>

      <div class="flex gap-4 mt-8">
        <button onclick="hideUploadModal()" class="flex-1 py-4 border border-gray-600 rounded-2xl hover:bg-gray-800">Cancel</button>
        <button onclick="startUpload()" id="uploadBtn" class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-500 rounded-2xl font-semibold">Upload Asset</button>
      </div>
    </div>
  </div>

  <script>
    const supabase = Supabase.createClient(
      'https://pibnmulaxqixmyjyemeh.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYm5tdWxheHFpeG15anllbWVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODk4NTYsImV4cCI6MjA5MzQ2NTg1Nn0.DqzFO4Z7IYUXxGb3D8n7hKfLjYcmYg2SQJfghlqmiSw'
    );

    let assets = [];
    let currentFile = null;

    async function loadAssets() {
      const { data, error } = await supabase
        .from('assets')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Load Error:", error);
        return;
      }
      assets = data || [];
      renderAssets(assets);
    }

    function renderAssets(data) {
      const grid = document.getElementById('assetGrid');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = `<p class="text-gray-400 text-center py-20 col-span-full">No assets yet. Upload the first one!</p>`;
        return;
      }

      data.forEach(asset => {
        const card = document.createElement('div');
        card.className = 'asset-card bg-gray-900 border border-gray-800 rounded-3xl overflow-hidden';
        card.innerHTML = `
          <img src="${asset.file_url}" class="w-full h-52 object-cover">
          <div class="p-6">
            <h3 class="font-semibold text-white text-lg mb-1">${asset.title}</h3>
            <p class="text-xs text-emerald-400 uppercase">${asset.category}</p>
            <button onclick="downloadAsset('${asset.title}', '${asset.file_url}')" 
                    class="mt-6 w-full py-4 bg-emerald-600 hover:bg-emerald-700 rounded-2xl text-sm font-medium">
              Download
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function downloadAsset(title, url) {
      const a = document.createElement('a');
      a.href = url;
      a.download = title;
      a.click();
    }

    function showUploadModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
    }

    function hideUploadModal() {
      document.getElementById('uploadModal').classList.add('hidden');
    }

    // File Handling
    document.getElementById('dropZone').addEventListener('click', () => {
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      currentFile = e.target.files[0];
    });

    async function startUpload() {
      if (!currentFile) return alert("Please select a file first!");

      const name = document.getElementById('assetName').value.trim() || currentFile.name.split('.')[0];
      const category = document.getElementById('uploadCategory').value;

      try {
        const fileName = `${Date.now()}-${currentFile.name}`;

        const { error: uploadError } = await supabase.storage
          .from('verse-assets')
          .upload(fileName, currentFile);

        if (uploadError) throw uploadError;

        const { data: urlData } = supabase.storage.from('verse-assets').getPublicUrl(fileName);

        const { error: dbError } = await supabase.from('assets').insert({
          title: name,
          category: category,
          type: currentFile.name.split('.').pop().toUpperCase(),
          size: (currentFile.size / 1024 / 1024).toFixed(2) + " MB",
          file_url: urlData.publicUrl
        });

        if (dbError) throw dbError;

        alert("✅ Asset uploaded successfully!");
        hideUploadModal();
        loadAssets();

      } catch (err) {
        console.error(err);
        alert("Upload failed: " + err.message);
      }
    }

    // Filters
    document.getElementById('searchInput').addEventListener('input', filterAssets);
    document.getElementById('categoryFilter').addEventListener('change', filterAssets);

    function filterAssets() {
      const term = document.getElementById('searchInput').value.toLowerCase().trim();
      const cat = document.getElementById('categoryFilter').value;
      const filtered = assets.filter(a => 
        (!term || a.title.toLowerCase().includes(term)) && (!cat || a.category === cat)
      );
      renderAssets(filtered);
    }

    // Initialize
    loadAssets();
  </script>
</body>
</html>
