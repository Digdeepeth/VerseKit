<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerseKit - Minimal Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; font-family: Arial">

  <h1>Supabase Upload Test</h1>
  <p>Check console (F12) after upload</p>

  <input type="file" id="fileInput">
  <br><br>
  <button onclick="testUpload()" style="padding: 12px 24px; background: #10b981; color: white; border: none; border-radius: 8px;">
    Test Upload
  </button>

  <script>
    const supabase = Supabase.createClient(
      'https://pibnmulaxqixmyjyemeh.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYm5tdWxheHFpeG15anllbWVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODk4NTYsImV4cCI6MjA5MzQ2NTg1Nn0.DqzFO4Z7IYUXxGb3D8n7hKfLjYcmYg2SQJfghlqmiSw'
    );

    async function testUpload() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert("Select a file first");

      console.log("Starting upload test...");

      try {
        const fileName = `${Date.now()}-${file.name}`;

        // 1. Upload to Storage
        console.log("Uploading to storage...");
        const { error: uploadError } = await supabase.storage
          .from('verse-assets')
          .upload(fileName, file);

        if (uploadError) {
          console.error("Storage Error:", uploadError);
          alert("Storage Error: " + uploadError.message);
          return;
        }

        console.log("✅ Storage upload successful");

        // 2. Get URL
        const { data: urlData } = supabase.storage.from('verse-assets').getPublicUrl(fileName);

        // 3. Insert into table
        console.log("Inserting into database...");
        const { error: dbError } = await supabase.from('assets').insert({
          title: file.name.split('.')[0],
          category: "test",
          type: file.name.split('.').pop().toUpperCase(),
          size: (file.size / 1024 / 1024).toFixed(2) + " MB",
          file_url: urlData.publicUrl
        });

        if (dbError) {
          console.error("Database Error:", dbError);
          alert("Database Error: " + dbError.message);
        } else {
          console.log("🎉 SUCCESS! Both storage and database should be updated.");
          alert("Upload completed successfully! Check Supabase now.");
        }

      } catch (err) {
        console.error("Unexpected Error:", err);
        alert("Unexpected error - check console");
      }
    }
  </script>
</body>
</html>
