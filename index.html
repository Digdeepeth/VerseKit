
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerseKit • Community Assets</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .asset-card { transition: all 0.3s; }
    .asset-card:hover { transform: translateY(-8px); }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col">
  <div class="max-w-7xl mx-auto px-6 py-10 flex-1">
    <h1 class="text-5xl font-bold text-white mb-2">VerseKit</h1>
    <p class="text-emerald-400 mb-8">Debug Mode</p>

    <button onclick="showUploadModal()" class="bg-emerald-600 px-8 py-4 rounded-2xl mb-8">
      Upload New Asset
    </button>

    <div id="assetGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-gray-900 p-8 rounded-3xl w-full max-w-md">
      <h2 class="text-xl font-bold mb-6">Upload Asset (Debug)</h2>
      
      <select id="uploadCategory" class="w-full p-4 rounded-xl bg-gray-800 mb-4">
        <option value="banner">Banner</option>
        <option value="logo">Logo</option>
        <option value="template">Template</option>
      </select>

      <input type="file" id="fileInput" class="hidden">
      <div id="dropZone" class="border-2 border-dashed border-gray-600 p-12 rounded-3xl text-center cursor-pointer">
        Click or drop file
      </div>

      <div class="mt-6">
        <button onclick="startUpload()" class="w-full bg-emerald-600 py-4 rounded-2xl">Upload Now</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pibnmulaxqixmyjyemeh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYm5tdWxheHFpeG15anllbWVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODk4NTYsImV4cCI6MjA5MzQ2NTg1Nn0.DqzFO4Z7IYUXxGb3D8n7hKfLjYcmYg2SQJfghlqmiSw';

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAssets() {
      console.log("🔄 Loading assets...");
      const { data, error } = await supabase.from('assets').select('*');
      console.log("📊 Assets loaded:", data);
      console.log("❌ Error:", error);
      
      const grid = document.getElementById('assetGrid');
      grid.innerHTML = '';

      if (data && data.length > 0) {
        data.forEach(a => {
          grid.innerHTML += `<div class="bg-gray-900 p-4 rounded-2xl"><img src="${a.file_url}" class="w-full h-40 object-cover rounded-xl"><p>${a.title}</p></div>`;
        });
      } else {
        grid.innerHTML = '<p class="text-gray-400">No assets yet. Upload one!</p>';
      }
    }

    function showUploadModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
    }

    async function startUpload() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files[0]) return alert("Please select a file");

      const file = fileInput.files[0];
      const category = document.getElementById('uploadCategory').value;

      try {
        alert("Uploading... Check console for logs");

        const fileName = Date.now() + "-" + file.name;

        // Upload to storage
        const { error: uploadError } = await supabase.storage
          .from('verse-assets')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: urlData } = supabase.storage.from('verse-assets').getPublicUrl(fileName);

        // Insert record
        const { error: dbError } = await supabase.from('assets').insert({
          title: file.name.split('.')[0],
          category: category,
          type: file.name.split('.').pop().toUpperCase(),
          size: (file.size / 1024 / 1024).toFixed(2) + " MB",
          file_url: urlData.publicUrl
        });

        if (dbError) throw dbError;

        alert("✅ Upload Successful!");
        loadAssets();

      } catch (err) {
        console.error("Upload Error:", err);
        alert("Upload Failed: " + err.message);
      }
    }

    // Auto load on start
    loadAssets();
  </script>
</body>
</html>
