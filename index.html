<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerseKit • Debug Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white p-8">
  <h1 class="text-4xl font-bold mb-2">VerseKit - Heavy Debug</h1>
  <p class="text-emerald-400 mb-8">Check Console (F12) after every action</p>

  <button onclick="showUploadModal()" class="bg-emerald-600 px-6 py-3 rounded-xl mb-8">
    Upload Test Asset
  </button>

  <div id="status" class="mb-6 text-sm"></div>
  <div id="assetGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

  <!-- Simple Modal -->
  <div id="uploadModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center">
    <div class="bg-gray-900 p-8 rounded-3xl w-full max-w-md">
      <h2 class="text-xl mb-4">Test Upload</h2>
      
      <select id="uploadCategory" class="w-full p-4 bg-gray-800 rounded-xl mb-4">
        <option value="banner">Banner</option>
        <option value="logo">Logo</option>
      </select>

      <input type="file" id="fileInput" class="block w-full mb-4">
      
      <button onclick="startUpload()" class="w-full bg-emerald-600 py-4 rounded-xl">
        Start Upload
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pibnmulaxqixmyjyemeh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYm5tdWxheHFpeG15anllbWVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODk4NTYsImV4cCI6MjA5MzQ2NTg1Nn0.DqzFO4Z7IYUXxGb3D8n7hKfLjYcmYg2SQJfghlqmiSw';

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAssets() {
      console.log("🔄 Loading assets from Supabase...");
      const { data, error } = await supabase.from('assets').select('*').order('created_at', { ascending: false });
      
      console.log("📊 Data returned:", data);
      console.log("❌ Error:", error);

      const grid = document.getElementById('assetGrid');
      grid.innerHTML = '';

      if (error) {
        grid.innerHTML = `<p class="text-red-400">Error: ${error.message}</p>`;
      } else if (data && data.length > 0) {
        data.forEach(asset => {
          grid.innerHTML += `
            <div class="bg-gray-900 p-4 rounded-2xl">
              <img src="${asset.file_url}" class="w-full h-40 object-cover rounded-xl mb-2">
              <p class="font-medium">${asset.title}</p>
              <p class="text-emerald-400 text-sm">${asset.category}</p>
            </div>`;
        });
      } else {
        grid.innerHTML = '<p class="text-gray-400">No assets found in database yet.</p>';
      }
    }

    function showUploadModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
    }

    async function startUpload() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) return alert("Please select a file");

      const category = document.getElementById('uploadCategory').value;
      console.log("🚀 Starting upload...", file.name);

      try {
        const fileName = `${Date.now()}-${file.name}`;

        console.log("1️⃣ Uploading to Storage bucket: verse-assets");

        const { error: uploadError } = await supabase.storage
          .from('verse-assets')
          .upload(fileName, file);

        if (uploadError) {
          console.error("Storage Upload Error:", uploadError);
          throw new Error("Storage: " + uploadError.message);
        }

        console.log("✅ File uploaded to storage");

        const { data: urlData } = supabase.storage.from('verse-assets').getPublicUrl(fileName);
        console.log("2️⃣ Public URL:", urlData.publicUrl);

        console.log("3️⃣ Inserting record into 'assets' table...");

        const { error: dbError } = await supabase.from('assets').insert({
          title: file.name.split('.')[0],
          category: category,
          type: file.name.split('.').pop().toUpperCase(),
          size: (file.size / 1024 / 1024).toFixed(2) + " MB",
          file_url: urlData.publicUrl,
          original_name: file.name
        });

        if (dbError) {
          console.error("Database Insert Error:", dbError);
          throw new Error("Database: " + dbError.message);
        }

        console.log("🎉 SUCCESS! Asset should now be saved.");
        alert("Upload completed! Check console and refresh.");
        loadAssets();

      } catch (err) {
        console.error("💥 Final Error:", err);
        alert("Upload failed - check console (F12)");
      }
    }

    // Load assets on start
    loadAssets();
  </script>
</body>
</html>
