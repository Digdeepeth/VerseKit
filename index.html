<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerseKit • Debug</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white p-8">
  <h1 class="text-4xl font-bold mb-4">VerseKit - Final Debug</h1>
  <p class="text-yellow-400 mb-8">Upload an image and check console + page</p>

  <button onclick="showUploadModal()" class="bg-emerald-600 px-8 py-4 rounded-2xl mb-8 font-medium">
    Upload Test Asset
  </button>

  <div id="status" class="mb-6 text-sm bg-gray-900 p-4 rounded-xl"></div>
  <div id="assetGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

  <div id="uploadModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center">
    <div class="bg-gray-900 p-8 rounded-3xl w-full max-w-md">
      <h2 class="text-2xl mb-6">Test Upload</h2>
      
      <select id="uploadCategory" class="w-full p-4 bg-gray-800 rounded-2xl mb-6">
        <option value="banner">Banner</option>
        <option value="logo">Logo</option>
        <option value="template">Template</option>
      </select>

      <input type="file" id="fileInput" class="block w-full mb-6">
      
      <button onclick="startUpload()" class="w-full bg-emerald-600 py-4 rounded-2xl font-medium">
        Upload to Supabase
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pibnmulaxqixmyjyemeh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYm5tdWxheHFpeG15anllbWVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODk4NTYsImV4cCI6MjA5MzQ2NTg1Nn0.DqzFO4Z7IYUXxGb3D8n7hKfLjYcmYg2SQJfghlqmiSw';

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAssets() {
      const { data, error } = await supabase.from('assets').select('*');
      const grid = document.getElementById('assetGrid');
      grid.innerHTML = '';

      if (error) {
        document.getElementById('status').innerHTML = `❌ Load Error: ${error.message}`;
      } else if (data && data.length > 0) {
        document.getElementById('status').innerHTML = `✅ Loaded ${data.length} assets`;
        data.forEach(a => {
          grid.innerHTML += `<div class="bg-gray-900 p-4 rounded-2xl"><img src="${a.file_url}" class="h-40 w-full object-cover rounded-xl"><p class="mt-2">${a.title}</p></div>`;
        });
      } else {
        document.getElementById('status').innerHTML = 'No assets in database yet';
      }
    }

    function showUploadModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
    }

    async function startUpload() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert("Select a file first");

      const status = document.getElementById('status');
      status.innerHTML = "Uploading...";

      try {
        const fileName = `${Date.now()}-${file.name}`;

        // 1. Upload file
        const { error: uploadError } = await supabase.storage.from('verse-assets').upload(fileName, file);
        if (uploadError) throw uploadError;

        // 2. Get URL
        const { data: urlData } = supabase.storage.from('verse-assets').getPublicUrl(fileName);

        // 3. Save record
        const { error: dbError } = await supabase.from('assets').insert({
          title: file.name.split('.')[0],
          category: document.getElementById('uploadCategory').value,
          type: file.name.split('.').pop().toUpperCase(),
          size: (file.size / 1024 / 1024).toFixed(2) + " MB",
          file_url: urlData.publicUrl
        });

        if (dbError) throw dbError;

        status.innerHTML = "✅ Upload Successful! Refreshing...";
        setTimeout(() => loadAssets(), 1000);

      } catch (err) {
        console.error(err);
        status.innerHTML = `❌ Failed: ${err.message}`;
      }
    }

    loadAssets();
  </script>
</body>
</html>
